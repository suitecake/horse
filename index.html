<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HORSE — build it, beat it, send it</title>
    <meta name="description" content="Build a pixel-art platformer level, beat it yourself, then send it to a friend and watch every one of their deaths." />
    <!-- Link previews (Discord, Slack, iMessage). Crawlers never see the #hash,
         so every level and ghost link gets this same card. og.html draws the image. -->
    <meta property="og:site_name" content="HORSE" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://horsie.netlify.app/" />
    <meta property="og:title" content="HORSE — build it, beat it, send it" />
    <meta property="og:description" content="A tiny platformer. Make a level, beat it, send the link, and watch every one of your friend's deaths." />
    <meta property="og:image" content="https://horsie.netlify.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A pixel-art horse leaps for a flag over a row of spikes, trailed by the ghosts of earlier attempts." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#ffd56b" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%231b1424'/><text x='3' y='13' font-size='13' font-family='monospace' font-weight='bold' fill='%23ffd56b'>H</text></svg>" />
  </head>
  <body>
    <header class="top">
      <a class="wordmark" href="./" aria-label="HORSE home">
        <span>H</span><span>O</span><span>R</span><span>S</span><span>E</span>
      </a>
      <p class="tagline">build it <i>·</i> beat it <i>·</i> send it</p>
      <button id="mute" class="mute" title="Toggle sound (M)">sound on</button>
    </header>
    <main id="app"></main>
    <footer class="foot">
      Levels live in the link. No accounts, no servers, no mercy.
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
